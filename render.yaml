services:
  # 1. Backend Service (FastAPI + Faster-Whisper + FFmpeg)
  - type: web
    name: meetingx-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: MAX_UPLOAD_SIZE_MB
        value: 500

  # 2. Frontend Service (React + Vite)
  - type: web
    name: meetingx-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
